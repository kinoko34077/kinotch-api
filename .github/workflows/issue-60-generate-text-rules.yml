name: Issue 60 Finalize Text Rules

on:
  push:
    branches:
      - fix/issue-60-canonical-fixed-rules

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Integrate current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
      - run: npm ci
      - run: npm run build:text-rules
      - name: Commit generated snapshot and retire temporary workflow
        run: |
          rm .github/workflows/issue-60-generate-text-rules.yml
          git add -A
          git commit -m "build: materialize canonical fixed rules on current main"
          git push origin HEAD:${GITHUB_REF_NAME}
