name: Issue 60 Generate Text Rules

on:
  push:
    branches:
      - fix/issue-60-canonical-fixed-rules

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
      - run: npm run build:text-rules
      - uses: actions/upload-artifact@v4
        with:
          name: issue-60-rules-generated
          path: src/text-core/rules.generated.mjs
          retention-days: 1
