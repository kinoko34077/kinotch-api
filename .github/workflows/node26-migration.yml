name: Node 26 migration verification

on:
  push:
    branches: [chore/node-26-runtime]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chore/node-26-runtime
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.10.0
          cache: npm
      - name: Synchronize lockfile runtime metadata
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff -- package-lock.json
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync Node 26 lockfile metadata"
            git push origin HEAD:chore/node-26-runtime
          fi
      - run: npm ci
      - run: npm test
      - name: Worker dry-runs on Node 26
        shell: bash
        run: |
          npx wrangler deploy --config wrangler.text-transform.jsonc --dry-run --var TEXT_CORE_SOURCE_REVISION:0000000000000000000000000000000000000000
          npx wrangler deploy --config wrangler.semantic-compression.jsonc --dry-run
          npx wrangler deploy --config wrangler.semantic-compression-mcp.jsonc --dry-run
          npx wrangler deploy --config wrangler.jsonc --dry-run
