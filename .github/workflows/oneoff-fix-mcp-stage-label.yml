name: One-off MCP stage label fix

on:
  push:
    branches:
      - fix/mcp-service-token-stage-label

permissions:
  contents: write

jobs:
  fix-stage-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcp-service-token-stage-label
          fetch-depth: 0
      - name: Replace stale session-cookie stage label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/deploy-production.mjs")
          s = p.read_text(encoding="utf-8")
          old = 'state.stage = "MCP Access session-cookie smoke";'
          new = 'state.stage = "MCP Access Service Token smoke";'
          if old in s:
              if s.count(old) != 1:
                  raise SystemExit(f"expected exactly one stale label, found {s.count(old)}")
              p.write_text(s.replace(old, new), encoding="utf-8")
          elif new in s:
              print("stage label already updated")
          else:
              raise SystemExit("expected MCP smoke stage label was not found")
          PY
          if git diff --quiet -- scripts/deploy-production.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/deploy-production.mjs
          git commit -m "fix: rename MCP release smoke stage"
          git push origin HEAD:fix/mcp-service-token-stage-label
