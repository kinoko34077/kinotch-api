name: Issue 60 Refresh Text Snapshot

on:
  push:
    branches:
      - fix/issue-60-canonical-fixed-rules

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
      - run: npm run build:text-snapshot
      - name: Commit refreshed generated snapshot and retire temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/issue-60-refresh-text-snapshot.yml
          git add -A
          git commit -m "build: refresh text snapshot for canonical fixed rules"
          git push origin HEAD:${GITHUB_REF_NAME}
