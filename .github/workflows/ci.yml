name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.12.1
          cache: npm
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Base compatibility check
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 base-check
      - name: Jev Audit private Worker dry-run
        run: npx wrangler deploy --config wrangler.jev-audit.jsonc --dry-run
      - name: Jev Audit MCP Worker dry-run
        run: npx wrangler deploy --config wrangler.jev-audit-mcp.jsonc --dry-run --var TEAM_DOMAIN:https://example.cloudflareaccess.com --var POLICY_AUD:test-aud
      - name: Gateway dry-run
        run: npx wrangler deploy --config wrangler.jsonc --dry-run
