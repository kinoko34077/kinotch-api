name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.12.1
          cache: npm
      - run: npm ci
      - run: npm test
      # Run the fail-closed registry advisory check after local tests so
      # temporary npm audit outages do not hide independent code regressions.
      # Registry failure is never accepted as security-audit success.
      - name: Audit production npm dependencies
        shell: bash
        run: |
          for attempt in 1 2; do
            log="$(mktemp)"
            if npm audit --omit=dev --audit-level=high --fetch-timeout=30000 --fetch-retries=1 > "$log" 2>&1; then
              cat "$log"
              rm -f "$log"
              exit 0
            fi
            cat "$log"
            if ! grep -Eiq 'Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|E50[234]' "$log"; then
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
            if [ "$attempt" -eq 2 ]; then
              echo "Security advisory endpoint unavailable after bounded retries; CI DENIED."
              exit 1
            fi
            sleep 5
          done
      - name: Base compatibility check
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 base-check
      - name: Jev Audit private Worker dry-run
        run: npx wrangler deploy --config wrangler.jev-audit.jsonc --dry-run
      - name: Semantic Compression MCP Worker dry-run
        run: npx wrangler deploy --config wrangler.semantic-compression-mcp.jsonc --dry-run --var TEAM_DOMAIN:https://example.cloudflareaccess.com --var POLICY_AUD:test-aud
      - name: Jev Audit MCP Worker dry-run
        run: npx wrangler deploy --config wrangler.jev-audit-mcp.jsonc --dry-run --var TEAM_DOMAIN:https://example.cloudflareaccess.com --var POLICY_AUD:test-aud
      - name: Gateway dry-run
        run: npx wrangler deploy --config wrangler.jsonc --dry-run
